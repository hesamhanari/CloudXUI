# --------------------------------------------------------
# 4. Global HTTP to HTTPS Redirect
# --------------------------------------------------------
server {
    listen 80;
    server_name DOMAIN www.DOMAIN SUB.DOMAIN SUBoff.DOMAIN ;
    
    return 301 https://$host$request_uri;
}
